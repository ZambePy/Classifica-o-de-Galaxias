# Variante de level3_nebula com backbone efficientnet_b0.
# Gerado por script: identico ao original exceto pelo backbone (e pelo
# batch, quando a VRAM exige). Faz parte da comparacao de arquiteturas
# prevista no roteiro do README.
# NIVEL 2b - tipo de nebulosa
# Classes: emission | reflection | planetary | supernova_remnant
#
# Dataset PEQUENO (poucos milhares) e muito desbalanceado - ha milhares de
# nebulosas planetarias catalogadas contra ~150 de reflexao. Ajustes
# especificos deste nivel:
#
#   freeze_backbone_epochs: 3  -> protege as features do ImageNet enquanto a
#                                 cabeca aprende; com poucos dados, soltar o
#                                 backbone na epoca 1 degrada tudo
#   dropout maior              -> regularizacao contra overfitting
#   lr menor                   -> passos menores em dataset pequeno
#   batch_size menor           -> mais passos por epoca

name: level3_nebula_efficientnet_b0
level: nebula
seed: 42

data:
  image_size: 224
  batch_size: 16
  # 4, nao 8. No Windows cada worker e um processo novo que reimporta torch
  # (~600 MB de memoria comprometida). Treino e validacao coexistem, entao o
  # custo real e num_workers + num_workers/2. Com 8 aqui, o arquivo de
  # paginacao estoura e os workers morrem no meio da epoca.
  num_workers: 4
  class_weights: sqrt_balanced
  augment: true

model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.4
  freeze_backbone_epochs: 3

optim:
  epochs: 40
  lr: 0.0001
  weight_decay: 0.0005
  scheduler: cosine
  label_smoothing: 0.1
  early_stopping_patience: 8
  # DESLIGADO de proposito nesta maquina. A GTX 1660 Ti (Turing TU116) nao
  # tem tensor cores: fp16 nao acelera nada e, medido aqui, deixa o treino
  # 4,6x MAIS LENTO (81 img/s contra 378). Pior, o cuDNN produz NaN no
  # forward a partir de batch 64 - treino inteiro perdido, em silencio.
  # Em GPU com tensor cores (RTX 20xx+), volte para true.
  mixed_precision: false
