# NIVEL 1 - que tipo de objeto e este?
# Classes: galaxy | nebula | other
#
# E o modelo mais critico da cascata: um erro aqui contamina tudo abaixo.
# Tambem e o que mais sofre com desbalanceamento - havera muito mais
# galaxias (Galaxy Zoo) do que nebulosas. Por isso class_weights: balanced
# e o dataset de galaxias deve ser SUBAMOSTRADO ao montar este nivel
# (ver scripts/make_splits.py, opcao --cap-per-class).

name: level1_object
level: object
seed: 42

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  class_weights: balanced
  augment: true

model:
  backbone: resnet18
  pretrained: true
  dropout: 0.2
  freeze_backbone_epochs: 0

optim:
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.05
  early_stopping_patience: 5
  mixed_precision: true
