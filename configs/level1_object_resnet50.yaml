# Variante de level1_object com backbone resnet50.
# Gerado por script: identico ao original exceto pelo backbone (e pelo
# batch, quando a VRAM exige). Faz parte da comparacao de arquiteturas
# prevista no roteiro do README.
# NIVEL 1 - que tipo de objeto e este?
# Classes: galaxy | nebula | other
#
# E o modelo mais critico da cascata: um erro aqui contamina tudo abaixo.
# Tambem e o que mais sofre com desbalanceamento - havera muito mais
# galaxias (Galaxy Zoo) do que nebulosas. Por isso class_weights: balanced
# e o dataset de galaxias deve ser SUBAMOSTRADO ao montar este nivel
# (ver scripts/make_splits.py, opcao --cap-per-class).

name: level1_object_resnet50
level: object
seed: 42

data:
  image_size: 224
  batch_size: 32
  # 4, nao 8. No Windows cada worker e um processo novo que reimporta torch
  # (~600 MB de memoria comprometida). Treino e validacao coexistem, entao o
  # custo real e num_workers + num_workers/2. Com 8 aqui, o arquivo de
  # paginacao estoura e os workers morrem no meio da epoca.
  num_workers: 4
  class_weights: balanced
  augment: true

model:
  backbone: resnet50
  pretrained: true
  dropout: 0.2
  freeze_backbone_epochs: 0

optim:
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  label_smoothing: 0.05
  early_stopping_patience: 10
  # DESLIGADO de proposito nesta maquina. A GTX 1660 Ti (Turing TU116) nao
  # tem tensor cores: fp16 nao acelera nada e, medido aqui, deixa o treino
  # 4,6x MAIS LENTO (81 img/s contra 378). Pior, o cuDNN produz NaN no
  # forward a partir de batch 64 - treino inteiro perdido, em silencio.
  # Em GPU com tensor cores (RTX 20xx+), volte para true.
  mixed_precision: false
